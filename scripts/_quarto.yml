project:
  type: website
  output-dir: _site

website:
  title: "suwo"
  description: "Obtaining nature media with the R package suwo -- analysis code and data"
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: p_averano_bock_analysis.qmd
        text: "Case study 1: Bellbird song variation"
      - href: mink_detection_analysis.qmd
        text: "Case study 2: Mink detection"
    right:
      - icon: github
        href: https://github.com/maRce10/suwo_publication
        aria-label: GitHub repository

format:
  html:
    css: qmd.css
    toc: true
    toc-depth: 3
    toc-location: left
    number-sections: true
    highlight-style: pygments
    code-fold: true
    code-tools: true
    df-print: kable
    fig-dpi: 300
    include-after-body: fig_download.html

execute:
  freeze: true

knitr:
  opts_chunk:
    fig.retina: 1  # keep figures at exactly fig-dpi (300), not 2x
